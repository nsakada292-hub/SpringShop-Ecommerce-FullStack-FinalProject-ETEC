spring.application.name=SpringShop-Backend

# Loads your real credentials from an untracked file if it exists. Safe to leave
# in place: "optional:" means the app starts normally when the file is absent
# (CI, production), and the file itself is gitignored.
spring.config.import=optional:application-local.properties

server.port=8080

# CORS - allowed frontend origins (local development)
app.cors.allowed-origins=http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:8080,http://localhost:8080

# Database - local PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_spring_shop_e-commerce_project}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT configuration - the secret MUST be a Base64-encoded value of at least 256 bits.
jwt.secret=XQbP/fAqeK8Da/YyIt1pFBNLwC/j4JHIq5hDWXXjMv2vcIEndyRTCI1SM1CGUGwKYEsWpC3G0H11BlFX5x86Hw==
# Access token expiry: 15 minutes
jwt.expiration=900000
# Refresh token expiry: 7 days
jwt.refresh-expiration=604800000
jwt.issuer=SpringShop-Backend

# Gmail SMTP configuration for sending OTP emails
# Required: create an App Password (https://myaccount.google.com/apppasswords)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Debug mail logging
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG

# OTP settings
app.otp.expiry-minutes=5
# Print OTP to server console for testing during development (true/false)
app.otp.log-to-console=true

# File upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Coupons / newsletter promo
# How many products a newsletter promo code can be used on (10% discount limit)
app.coupon.max-usages=5

# Security
security.bcrypt.strength=12

# Admin bootstrap
app.admin.email=admin@springshop.com
app.admin.password=Admin@1234!

# ------------------------------------------------------------------
# Bakong KHQR payment configuration
#
# Every secret below comes from the environment. Nothing sensitive is
# committed - set these as env vars, or in an untracked application-local.properties:
#
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   MAIL_USERNAME, MAIL_PASSWORD        (Gmail App Password)
#   BAKONG_TOKEN                         (static token from the portal)
#   BAKONG_EMAIL                         (used to auto-renew when no token)
#   BAKONG_ACCOUNT_ID                    (the wallet that receives the money)
#   BAKONG_MERCHANT_ID                   (MID issued by your bank; enables tag 30)
#
# Get a token at https://api-bakong.nbc.gov.kh/ (production) or
# https://sit-api-bakong.nbc.gov.kh/ (sandbox, no real money).
# Tokens are valid for 90 days; the portal emails you before yours expires.
# ------------------------------------------------------------------
bakong.base-url=${BAKONG_BASE_URL:https://api-bakong.nbc.gov.kh}
bakong.token=${BAKONG_TOKEN:}
bakong.email=${BAKONG_EMAIL:}
# The Bakong wallet ID that actually receives the money, e.g. neourm_sakada@bkrt
# for a Bakong app account, or yourname@aclb for an ACLEDA-registered wallet.
# Must match, character for character, the ID shown in your Bakong/bank app.
# This is NOT your mobile number. A phone number works for receiving inside the
# Bakong app, but it cannot be encoded in a KHQR - the SDK rejects it as
# "Bakong Account ID is invalid" and every checkout fails. Format: name@bank
bakong.account-id=${BAKONG_ACCOUNT_ID:}
# Merchant ID issued by your bank. Setting this switches the QR from an
# individual/solo wallet code (tag 29) to a corporate merchant code (tag 30).
# Tag 30 is what every bank app accepts and what stops payer apps rejecting the
# receiver as "not verified". It cannot be self-assigned - your bank must issue it.
bakong.merchant-id=${BAKONG_MERCHANT_ID:}
# Merchant display name + city shown inside the QR
bakong.merchant-name=${BAKONG_MERCHANT_NAME:SpringShop}
bakong.merchant-city=${BAKONG_MERCHANT_CITY:PHNOM PENH}
# Acquiring bank code. ACLB (ACLEDA), ABAA (ABA), WING (Wing), CADB (Canadia)
bakong.acquiring-bank=${BAKONG_ACQUIRING_BANK:ACLB}
# EMVCo Merchant Category Code. 5999 = generic retail. 5411 = grocery,
# 5734 = electronics/software, 5651 = clothing.
bakong.merchant-category-code=${BAKONG_MCC:5999}
# USD -> KHR rate used when the customer chooses to pay in Riel
bakong.usd-to-khr-rate=${BAKONG_USD_TO_KHR:4000}
# QR validity window in minutes
bakong.qr-expiry-minutes=${BAKONG_QR_EXPIRY_MINUTES:15}
# Slack allowed when matching a settled payment to the order total, so that FX
# rounding on a converted KHR payment is not rejected as a mismatch.
bakong.amount-tolerance-absolute=${BAKONG_AMOUNT_TOLERANCE_ABSOLUTE:0.01}
bakong.amount-tolerance-relative=${BAKONG_AMOUNT_TOLERANCE_RELATIVE:0.01}
# Mock mode: true = end-to-end flow without contacting Bakong (local dev only).
bakong.mock=${BAKONG_MOCK:false}
# Merchant KHQR demo mode: generates a real corporate merchant QR (tag 30) using
# NBC's public sandbox merchant values, entirely offline. The payment is still
# simulated, so no money moves. Use it to demo; never to take real payments.
bakong.demo-merchant=${BAKONG_DEMO_MERCHANT:false}
# Advisory account lookup. Bakong does not require it to issue or pay a KHQR, and
# it returns false negatives for Bakong-native ids (name@bkrt), so it is off by
# default and can only ever log - it never blocks checkout.
bakong.verify-receiver-on-initiate=${BAKONG_VERIFY_RECEIVER:false}

# ------------------------------------------------------------------
# API request budget
#
# NBC allows ~100 API requests per day, resetting daily, and a replacement token
# can take up to 24h to be emailed. Running out is expensive: payments stop being
# detected until the next reset. Two things keep usage inside the allowance:
#
#   1. A browser may poll as often as it likes, but a status answer is only
#      fetched from Bakong once per min-status-check-interval-seconds. Repeat
#      polls are answered from cache for free.
#   2. A background pass reconciles every unsettled KHQR using the batched
#      check_transaction_by_md5_list endpoint, so N pending orders cost one
#      request instead of N - and payments still settle after the tab is closed.
#
# Every outbound call is counted against daily-request-budget and refused when it
# is spent. Keep a margin below the real limit; 90 leaves room for retries.
#
# Important: production only answers check_transaction_by_md5, one hash per
# request. check_transaction_by_md5_list is documented and present in the SDKs but
# the live gateway answers 403 for a standard account, so status-batch-supported is
# off. If NBC grants your account access, turn it on and N orders cost 1 request.
# ------------------------------------------------------------------
bakong.daily-request-budget=${BAKONG_DAILY_REQUEST_BUDGET:90}
# Minimum seconds between live lookups of the same KHQR.
bakong.min-status-check-interval-seconds=${BAKONG_MIN_STATUS_CHECK_SECONDS:60}
bakong.status-batch-supported=${BAKONG_STATUS_BATCH_SUPPORTED:false}
# Max unsettled payments the background reconciler checks per pass. Each costs a
# request in production, so keep this small.
bakong.reconciliation-batch-limit=${BAKONG_RECONCILE_BATCH_LIMIT:5}
# Background reconciliation cadence, in seconds.
bakong.reconciliation-interval-seconds=${BAKONG_RECONCILE_INTERVAL_SECONDS:300}
bakong.reconciliation-initial-delay-seconds=${BAKONG_RECONCILE_INITIAL_DELAY_SECONDS:60}
# Off by default: production costs one request per hash, so a reconciler that
# sweeps unsettled orders every 5 minutes would burn the whole 100/day allowance
# in about 90 minutes and leave nothing for real checkouts. Enable it only once
# NBC grants a much higher limit.
bakong.reconciliation-enabled=${BAKONG_RECONCILE_ENABLED:false}
# How long an advisory receiver lookup stays valid before it is repeated.
bakong.receiver-cache-minutes=${BAKONG_RECEIVER_CACHE_MINUTES:720}