<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Card Fan Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0b;
    --panel: #121214;
    --ink: #f4f2ee;
    --muted: #8b8a8d;
    --accent: #ff5a36;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .hero{
    max-width: 1080px;
    margin: 0 auto;
    padding: 48px 24px 64px;
  }

  .hero__top{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 36px;
  }

  .hero__heading{
    font-size: clamp(28px, 4.2vw, 44px);
    line-height: 1.15;
    margin: 0;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .hero__heading em{
    display: block;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    color: var(--accent);
  }

  .toggle{
    flex: none;
    width: 52px;
    height: 52px;
    border-radius: 999px;
    border: 1px solid rgba(244,242,238,0.16);
    background: rgba(244,242,238,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink);
    transition: background .2s ease, border-color .2s ease, transform .2s ease;
  }
  .toggle:hover{
    background: rgba(244,242,238,0.1);
    border-color: rgba(244,242,238,0.3);
  }
  .toggle:active{ transform: scale(0.94); }
  .toggle svg{ width: 18px; height: 18px; display: block; }
  .toggle .icon-play{ display: none; margin-left: 2px; }
  .toggle.is-paused .icon-pause{ display: none; }
  .toggle.is-paused .icon-play{ display: block; }

  .stage{
    position: relative;
    background: linear-gradient(180deg, var(--panel), #0d0d0f);
    border-radius: 28px;
    height: 520px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.07);
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 30px;
  }

  .stage::after{
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, var(--panel) 0%, rgba(18,18,20,0) 15%, rgba(18,18,20,0) 85%, var(--panel) 100%);
    z-index: 30;
  }

  .fan{
    position: relative;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    padding-bottom: 20px;
  }

  .card-wrapper{
    position: absolute;
    width: 180px;
    height: 330px;
    transform-origin: 50% 110%;
    will-change: transform;
    transition: margin .3s ease;
  }

  .card{
    width: 100%;
    height: 100%;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    background: #1c1c20;
    box-shadow: 0 24px 38px -12px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.1) inset;
    cursor: pointer;
    transition: transform .4s cubic-bezier(.22,.9,.32,1), box-shadow .3s ease;
  }

  .card-wrapper:hover .card{
    transform: translateY(-24px) scale(1.06);
    box-shadow: 0 35px 50px -10px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.2) inset;
    z-index: 40;
  }

  .face{
    position: absolute;
    inset: 0;
    opacity: 0;
    background-size: cover;
    background-position: center;
    transition: opacity 1s ease-in-out, transform 1.2s ease;
    transform: scale(1.08);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px;
  }

  .face::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }

  .face.is-active{
    opacity: 1;
    transform: scale(1);
  }

  .face__eyebrow{
    position: relative;
    z-index: 2;
    align-self: flex-start;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(0,0,0,0.45);
    padding: 5px 10px;
    border-radius: 999px;
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
  }

  .face__content{
    position: relative;
    z-index: 2;
  }

  .face__title{
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  .face__tag{
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    display: block;
  }

  .stage__hint{
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    z-index: 35;
    pointer-events: none;
  }

  @media (max-width: 640px){
    .hero{ padding: 32px 16px; }
    .stage{ height: 420px; }
    .card-wrapper{ width: 140px; height: 260px; }
    .face__title{ font-size: 16px; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero__top">
    <h1 class="hero__heading">We build products that<em>feel alive, not assembled.</em></h1>
    <button class="toggle" id="toggle" aria-label="Pause animation" aria-pressed="false">
      <svg class="icon-pause" viewBox="0 0 24 24" fill="none"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
      <svg class="icon-play" viewBox="0 0 24 24" fill="none"><path d="M7 5v14l12-7L7 5z" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="fan" id="fan"></div>
    <div class="stage__hint">5 dynamic slots &bull; continuous sway &bull; auto-cycling visuals</div>
  </div>
</div>

<script>
(function(){
  var CARD_COUNT = 5;
  var CENTER = (CARD_COUNT - 1) / 2; // 2

  // Image collection that will cycle through the cards
  var GALLERY = [
    { eyebrow: 'Nature',   title: 'Elysian', tag: 'Dolomites, IT', img: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=600&auto=format&fit=crop' },
    { eyebrow: 'Studio',   title: 'Marrow',  tag: 'Editorial UI',  img: 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=600&auto=format&fit=crop' },
    { eyebrow: 'Design',   title: 'Kinfolk', tag: 'Minimal Living',img: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=600&auto=format&fit=crop' },
    { eyebrow: 'Interior', title: 'Halden',  tag: 'Arch Digest',   img: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=600&auto=format&fit=crop' },
    { eyebrow: 'Fashion',  title: 'Isolde',  tag: 'Autumn/Winter', img: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600&auto=format&fit=crop' },
    { eyebrow: 'Object',   title: 'Ferra',   tag: 'Brutal Ceramic',img: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=600&auto=format&fit=crop' },
    { eyebrow: 'Field',    title: 'Nomad',   tag: 'Spatial Audio', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop' },
    { eyebrow: 'Coffee',   title: 'Aroma',   tag: 'Specialty Roast',img:'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop' },
    { eyebrow: 'Urban',    title: 'Vesper',  tag: 'Night Series',  img: 'https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=600&auto=format&fit=crop' }
  ];

  var fan = document.getElementById('fan');
  var toggleBtn = document.getElementById('toggle');
  var cards = [];
  var isPlaying = true;
  var globalImgIndex = CARD_COUNT;
  var animationFrameId = null;

  // Render content onto face
  function populateFace(faceEl, item){
    faceEl.style.backgroundImage = 'url("' + item.img + '")';
    faceEl.innerHTML = 
      '<span class="face__eyebrow">' + item.eyebrow + '</span>' +
      '<div class="face__content">' +
        '<h3 class="face__title">' + item.title + '</h3>' +
        '<span class="face__tag">' + item.tag + '</span>' +
      '</div>';
  }

  // Create 5 Cards
  for (var i = 0; i < CARD_COUNT; i++){
    var offset = i - CENTER; // -2, -1, 0, 1, 2
    var wrapper = document.createElement('div');
    wrapper.className = 'card-wrapper';
    wrapper.style.zIndex = String(10 - Math.abs(offset));

    var card = document.createElement('div');
    card.className = 'card';

    var faceA = document.createElement('div');
    faceA.className = 'face is-active';
    var faceB = document.createElement('div');
    faceB.className = 'face';

    populateFace(faceA, GALLERY[i % GALLERY.length]);

    card.appendChild(faceA);
    card.appendChild(faceB);
    wrapper.appendChild(card);
    fan.appendChild(wrapper);

    cards.push({
      wrapper: wrapper,
      offset: offset,
      faces: [faceA, faceB],
      activeFace: 0,
      timer: null
    });
  }

  // Continuous Left-Right Swaying Loop
  function tick(timestamp){
    if (isPlaying){
      var time = timestamp * 0.0018; // Speed of swaying

      cards.forEach(function(c, i){
        // Dynamic wave movement: sway X, gentle bobbing Y, dynamic rotation
        var wave = Math.sin(time + i * 0.5);
        var rotSway = wave * 4.5;
        var xSway = Math.sin(time + i * 0.4) * 22;
        var ySway = Math.cos(time + i * 0.6) * 8;

        // Base fan arc transforms
        var baseRot = c.offset * 11;
        var baseX = c.offset * 125;
        var baseY = Math.pow(Math.abs(c.offset), 1.5) * 14;

        var totalRot = baseRot + rotSway;
        var totalX = baseX + xSway;
        var totalY = baseY + ySway;
        var scale = 1 - Math.abs(c.offset) * 0.03;

        c.wrapper.style.transform = 'translate3d(' + totalX + 'px, ' + totalY + 'px, 0) rotate(' + totalRot + 'deg) scale(' + scale + ')';
      });
    }
    animationFrameId = requestAnimationFrame(tick);
  }

  // Dynamic Image Crossfade Sequence
  function cycleCardImage(c){
    var nextFaceIdx = c.activeFace === 0 ? 1 : 0;
    var nextItem = GALLERY[globalImgIndex % GALLERY.length];
    globalImgIndex++;

    populateFace(c.faces[nextFaceIdx], nextItem);
    c.faces[nextFaceIdx].classList.add('is-active');
    c.faces[c.activeFace].classList.remove('is-active');
    c.activeFace = nextFaceIdx;
  }

  function scheduleCardSwap(c, index){
    // Stagger image changes every 2.4 - 3.8 seconds continuously
    var delay = 2400 + (index * 600) + Math.random() * 400;
    c.timer = setTimeout(function(){
      if (isPlaying) {
        cycleCardImage(c);
      }
      scheduleCardSwap(c, index);
    }, delay);
  }

  function start(){
    cards.forEach(function(c, i){
      scheduleCardSwap(c, i);
    });
  }

  function stop(){
    cards.forEach(function(c){
      clearTimeout(c.timer);
    });
  }

  // Play/Pause button handler
  toggleBtn.addEventListener('click', function(){
    isPlaying = !isPlaying;
    toggleBtn.classList.toggle('is-paused', !isPlaying);
    toggleBtn.setAttribute('aria-pressed', String(!isPlaying));
    toggleBtn.setAttribute('aria-label', isPlaying ? 'Pause animation' : 'Play animation');
    if (isPlaying) start(); else stop();
  });

  // Start continuous loop
  animationFrameId = requestAnimationFrame(tick);
  start();
})();
</script>

</body>
</html>
