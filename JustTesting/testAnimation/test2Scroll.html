<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FRAMES — Supercharge your design workflow with AI</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
          animation: {
            'scroll-up-slow': 'scrollUp 40s linear infinite',
            'scroll-up-fast': 'scrollUp 28s linear infinite',
            'scroll-down-slow': 'scrollDown 38s linear infinite',
            'scroll-down-fast': 'scrollDown 32s linear infinite',
          },
          keyframes: {
            scrollUp: {
              '0%': { transform: 'translate3d(0, 0, 0)' },
              '100%': { transform: 'translate3d(0, -50%, 0)' },
            },
            scrollDown: {
              '0%': { transform: 'translate3d(0, -50%, 0)' },
              '100%': { transform: 'translate3d(0, 0, 0)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* ✨ LIGHT MODE: Tuned slightly clearer so background images pop nicely ✨ */
    .hero-vignette {
      background: radial-gradient(
        circle at 50% 50%,
        rgba(248, 249, 250, 0.56) 0%,
        rgba(248, 249, 250, 0.72) 45%,
        rgba(248, 249, 250, 0.86) 78%,
        rgba(248, 249, 250, 0.96) 100%
      );
    }

    /* DARK MODE: Deep cinematic contrast */
    .dark .hero-vignette {
      background: radial-gradient(
        circle at 50% 50%,
        rgba(8, 8, 10, 0.72) 0%,
        rgba(8, 8, 10, 0.85) 45%,
        rgba(8, 8, 10, 0.94) 80%,
        rgba(8, 8, 10, 1) 100%
      );
    }

    /* Vertical edge fade */
    .vertical-fade {
      mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
    }

    /* Typewriter blinking cursor */
    .typewriter-cursor {
      display: inline-block;
      width: 3px;
      margin-left: 3px;
      animation: cursorBlink 0.8s infinite;
      vertical-align: baseline;
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 🔥 VIBRATING / SHAKING ANIMATION ON HOVER 🔥 */
    @keyframes typewriterShake {
      0%   { transform: translate(0px, 0px) rotate(0deg); }
      15%  { transform: translate(-2.5px, 1.5px) rotate(-1deg); }
      30%  { transform: translate(2.5px, -1.5px) rotate(1.2deg); }
      45%  { transform: translate(-2px, -2px) rotate(-0.8deg); }
      60%  { transform: translate(2px, 1.8px) rotate(0.9deg); }
      75%  { transform: translate(-1.5px, 1px) rotate(-1.1deg); }
      90%  { transform: translate(1.8px, -1px) rotate(0.7deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }

    .typewriter-badge {
      display: inline-block;
      transition: filter 0.2s ease;
      cursor: crosshair;
    }

    .typewriter-badge:hover {
      animation: typewriterShake 0.12s infinite ease-in-out;
      filter: drop-shadow(0 0 16px rgba(45, 212, 191, 0.7));
    }

    /* Pause background columns when hovering stage */
    .gallery-container:hover .marquee-col {
      animation-play-state: paused;
    }
  </style>
</head>

<body class="bg-[#f8f9fa] dark:bg-[#08080a] text-neutral-900 dark:text-white min-h-screen relative overflow-hidden font-sans select-none transition-colors duration-300">

  <!-- ================= BACKGROUND ANIMATED COLUMNS ================= -->
  <div class="gallery-container absolute inset-0 w-full h-full vertical-fade overflow-hidden pointer-events-none z-0">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 sm:gap-4 md:gap-6 w-[130%] sm:w-[115%] lg:w-[110%] -left-[15%] sm:-left-[7.5%] lg:-left-[5%] relative h-full">
      <div class="marquee-col animate-scroll-down-slow flex flex-col gap-3 sm:gap-4 md:gap-6 will-change-transform" id="col-1"></div>
      <div class="marquee-col animate-scroll-up-fast flex flex-col gap-3 sm:gap-4 md:gap-6 will-change-transform" id="col-2"></div>
      <div class="marquee-col animate-scroll-down-fast flex flex-col gap-3 sm:gap-4 md:gap-6 will-change-transform" id="col-3"></div>
      <div class="marquee-col animate-scroll-up-slow hidden md:flex flex-col gap-4 md:gap-6 will-change-transform" id="col-4"></div>
      <div class="marquee-col animate-scroll-down-fast hidden lg:flex flex-col gap-6 will-change-transform" id="col-5"></div>
    </div>
  </div>

  <!-- Radial Contrast Vignette -->
  <div class="hero-vignette absolute inset-0 pointer-events-none z-10 transition-colors duration-500"></div>

  <!-- ================= TOP NAVIGATION ================= -->
  <header class="relative z-20 w-full max-w-7xl mx-auto px-4 sm:px-6 md:px-8 py-5 sm:py-7 flex items-center justify-between">
    <!-- Brand Logo -->
    <a href="#" class="flex items-center gap-2.5 group">
      <div class="w-8 h-8 rounded-lg bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 flex items-center justify-center font-bold text-sm shadow-md transition-transform group-hover:scale-105">
        F
      </div>
      <span class="font-extrabold tracking-widest text-lg sm:text-xl text-neutral-900 dark:text-white uppercase font-sans">
        FRAMES
      </span>
    </a>

    <!-- Nav Controls -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <!-- Dark / Light Mode Toggle -->
      <button 
        id="themeToggle" 
        class="w-10 h-10 rounded-xl flex items-center justify-center border border-black/10 dark:border-white/10 bg-white/70 dark:bg-white/5 backdrop-blur-md hover:bg-black/5 dark:hover:bg-white/10 text-neutral-700 dark:text-neutral-300 shadow-sm transition-all active:scale-95" 
        aria-label="Toggle Theme"
      >
        <svg id="sunIcon" class="w-4 h-4 hidden dark:block fill-current" viewBox="0 0 24 24">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg id="moonIcon" class="w-4 h-4 block dark:hidden fill-current" viewBox="0 0 24 24">
          <path d="M12.3 2a10 10 0 0 0-1.9 20 10 10 0 0 0 9.8-7.7 1 1 0 0 0-1.2-1.2 8 8 0 1 1-7.9-10 1 1 0 0 0-1-1.1z"/>
        </svg>
      </button>

      <!-- Get Started Button -->
      <a href="#" class="inline-flex items-center gap-1.5 sm:gap-2 px-3.5 sm:px-5 py-2.5 rounded-xl bg-neutral-900 hover:bg-neutral-800 text-white dark:bg-white dark:hover:bg-neutral-200 dark:text-neutral-950 text-xs sm:text-sm font-semibold tracking-tight transition-all duration-200 shadow-md hover:scale-105 active:scale-95">
        <span>Get started</span>
        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </header>

  <!-- ================= CENTER HERO CONTENT ================= -->
  <main class="relative z-20 flex flex-col items-center justify-center text-center px-4 sm:px-6 min-h-[calc(100vh-150px)] -mt-6 sm:-mt-10">
    <div class="max-w-4xl mx-auto space-y-5 sm:space-y-7">
      
      <!-- Headline with Interactive Shaking Typewriter -->
      <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight leading-[1.15] text-neutral-950 dark:text-white drop-shadow-[0_1px_8px_rgba(255,255,255,0.7)] dark:drop-shadow-none">
        Supercharge 
        <!-- Hover this span to shake! -->
        <span class="typewriter-badge inline-flex items-baseline px-1.5 py-0.5 rounded-lg border border-teal-500/25 bg-teal-500/10 dark:bg-teal-400/10 backdrop-blur-xs">
          <span id="typewriterText" class="bg-gradient-to-r from-teal-600 via-cyan-600 to-blue-600 dark:from-cyan-400 dark:via-teal-300 dark:to-emerald-400 bg-clip-text text-transparent font-extrabold">your design</span>
          <span class="typewriter-cursor bg-teal-600 dark:bg-teal-300 h-[0.78em]"></span>
        </span>
        workflow with AI
      </h1>

      <!-- Subtitle -->
      <p class="text-sm sm:text-base md:text-lg lg:text-xl text-neutral-700 dark:text-neutral-400 max-w-xl mx-auto font-medium font-body leading-relaxed">
        All the models, all your generations, one platform.
      </p>

      <!-- CTA -->
      <div class="pt-3 sm:pt-4">
        <a href="#" class="inline-flex items-center gap-2.5 px-6 sm:px-8 py-3 sm:py-4 rounded-xl bg-neutral-900 hover:bg-neutral-800 text-white dark:bg-white dark:hover:bg-neutral-100 dark:text-black text-sm sm:text-base font-semibold tracking-tight transition-all duration-200 shadow-xl dark:shadow-[0_0_40px_rgba(255,255,255,0.22)] hover:scale-105 active:scale-95">
          <span>Start for free</span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>

    </div>
  </main>

  <!-- ================= JAVASCRIPT ================= -->
  <script>
    // 1. Curated Artwork Data
    const columnData = {
      1: [
        { img: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&auto=format&fit=crop', title: 'Purple Sunset Peak' },
        { img: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop', title: 'Classical Anime Portrait' },
        { img: 'https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=600&auto=format&fit=crop', title: 'Vibrant Wave Abstract' },
      ],
      2: [
        { img: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b675?q=80&w=600&auto=format&fit=crop', title: 'Golden Frame Oil' },
        { img: 'https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=600&auto=format&fit=crop', title: 'Winter Landscape' },
        { img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600&auto=format&fit=crop', title: 'Minimalist Fluid' },
      ],
      3: [
        { img: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=600&auto=format&fit=crop', title: 'Chromatic Gradient Aura' },
        { img: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&auto=format&fit=crop', title: '3D Character Mascot' },
        { img: 'https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?q=80&w=600&auto=format&fit=crop', title: 'Holographic Sculpture' },
      ],
      4: [
        { img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&auto=format&fit=crop', title: 'Crimson Cyber Noir' },
        { img: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=600&auto=format&fit=crop', title: 'Warm Spatial Design' },
        { img: 'https://images.unsplash.com/photo-1579783900882-c0d3dad7b119?q=80&w=600&auto=format&fit=crop', title: 'Impressionist Floral' },
      ],
      5: [
        { img: 'https://images.unsplash.com/photo-1507679799987-c73779587ccf?q=80&w=600&auto=format&fit=crop', title: 'Illustration Letters' },
        { img: 'https://images.unsplash.com/photo-1563089145-599997674d42?q=80&w=600&auto=format&fit=crop', title: 'Neon Ambient Glow' },
        { img: 'https://images.unsplash.com/photo-1513519245088-0e12902e5a38?q=80&w=600&auto=format&fit=crop', title: 'Studio Still Life' },
      ]
    };

    function renderColumn(colId, items) {
      const colEl = document.getElementById(`col-${colId}`);
      if (!colEl) return;

      const fullList = [...items, ...items, ...items, ...items];
      colEl.innerHTML = fullList.map(item => `
        <div class="relative w-full aspect-[4/5] rounded-xl sm:rounded-2xl md:rounded-3xl overflow-hidden bg-white dark:bg-neutral-900 border border-black/10 dark:border-white/[0.08] shadow-md dark:shadow-2xl">
          <img 
            src="${item.img}" 
            alt="${item.title}" 
            class="w-full h-full object-cover select-none transform hover:scale-105 transition-transform duration-500"
            loading="lazy"
          />
        </div>
      `).join('');
    }

    Object.keys(columnData).forEach(colId => {
      renderColumn(colId, columnData[colId]);
    });

    // 2. Typewriter Effect
    const words = [
      'your design',
      'visual identity',
      'creative ideas',
      'brand systems',
      '3D artwork'
    ];
    
    let wordIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typewriterEl = document.getElementById('typewriterText');

    function typeEffect() {
      const currentWord = words[wordIndex];
      
      if (isDeleting) {
        charIndex--;
        typewriterEl.textContent = currentWord.substring(0, charIndex);
      } else {
        charIndex++;
        typewriterEl.textContent = currentWord.substring(0, charIndex);
      }

      let typeSpeed = isDeleting ? 45 : 95;

      if (!isDeleting && charIndex === currentWord.length) {
        typeSpeed = 1800;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        typeSpeed = 400;
      }

      setTimeout(typeEffect, typeSpeed);
    }

    typeEffect();

    // 3. Dark / Light Mode Switcher
    const themeToggleBtn = document.getElementById('themeToggle');
    const htmlEl = document.documentElement;

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme === 'light' || (!savedTheme && !systemPrefersDark)) {
      htmlEl.classList.remove('dark');
    } else {
      htmlEl.classList.add('dark');
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = htmlEl.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
