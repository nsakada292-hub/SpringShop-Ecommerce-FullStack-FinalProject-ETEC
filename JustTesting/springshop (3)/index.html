<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpringShop — Modern Fashion & Apparel Store</title>
  <meta name="description" content="SpringShop is an online fashion store selling clothing, shoes, bags, and accessories." />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS CDN for instant styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: { 
          colors: {
            spring: {
              primary: '#C1E899',
              brown: '#9A6735',
              light: '#E6F0DC',
              dark: '#55883B',
              hover: '#456f30'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- App Custom Styles -->
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <link rel="stylesheet" href="./assets/css/storefront.css" />
</head>
<body class="min-h-screen flex flex-col bg-[#ffffff] dark:bg-[#131713] text-gray-900 dark:text-gray-100 transition-colors duration-200">

  <!-- Navbar Container (Hydrated by Navbar.render()) -->
  <div id="mainNavbarContainer"></div>

  <!-- Main Storefront Body Content -->
  <main class="flex-1">
    
    <!-- Hero Banner Section -->
    <div id="heroContainer"></div>  


    <!-- Products & Shopping Grid Section -->
    <section id="productsSection" class="py-14 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Section Header -->
      <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-[#55883B] dark:text-[#79bf54] block mb-1">
            Curated Apparel
          </span>
          <h2 id="productsSectionTitle" class="text-2xl sm:text-3xl font-extrabold text-gray-900 dark:text-white tracking-tight">
            Featured Collection
          </h2>
          <p id="productsSectionDesc" class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-1 max-w-xl">
            Explore our curated apparel, footwear, and accessories crafted for timeless style and effortless elegance.
          </p>
        </div>

        <!-- Sorting Selector -->
        <div class="flex items-center gap-3">
          <label for="sortSelector" class="text-xs font-semibold text-gray-500 dark:text-gray-400 whitespace-nowrap">Sort by:</label>
          <select 
            id="sortSelector" 
            onchange="Store.handleSortChange(this.value)" 
            class="form-input py-1.5 px-3 text-xs rounded-lg border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200">
            <option value="default">Featured / Default</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Alphabetical (A - Z)</option>
          </select>
        </div>
      </div>

      <!-- Category Filter Pills (Hydrated by Store.renderCategoryFilterPills()) -->
      <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-8 scrollbar-none" id="categoryFilterPills">
        <!-- Injected dynamically -->
      </div>

      <!-- Item Count Indicator -->
      <div class="flex items-center justify-between text-xs text-gray-400 mb-6">
        <span id="productsCountLabel">Loading collection...</span>
      </div>

      <!-- Dynamic Product Grid (Hydrated by Store.renderProductsGrid()) -->
      <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Hydrated dynamically -->
      </div>

      <!-- Pagination Controls -->
      <div id="productsPagination" class="mt-8"></div>
    </section>

    <!-- Customer Reviews / Testimonials Section -->
    <div id="reviewsContainer"></div>

  </main>

  <!-- Footer Container (Hydrated by Footer.render()) -->
  <div id="footerContainer"></div>

  <!-- Floating Back to Top Button -->
  <button id="backToTopBtn" class="back-to-top" aria-label="Back to Top" title="Back to top">
    <i class="fa-solid fa-arrow-up text-sm"></i>
  </button>

  <!-- Modals & Drawers Container Hooks -->
  <div id="globalModalContainer"></div>
  <div id="cartDrawerContainer"></div>
  <div id="mobileMenuDrawerContainer"></div>
  <div id="confirmationModalContainer"></div>

  <!-- Vanilla JS Architecture Scripts (Strictly Ordered) -->
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/utils/storage.js"></script>
  <script src="./assets/js/utils/formatter.js"></script>
  <script src="./assets/js/utils/validator.js"></script>
  <script src="./assets/js/utils/debounce.js"></script>
  <script src="./assets/js/utils/error-handler.js"></script>
  <script src="./assets/js/utils/auth-guard.js"></script>

  <script src="./assets/js/api/client.js"></script>
  <script src="./assets/js/api/auth.js"></script>
  <script src="./assets/js/api/products.js"></script>
  <script src="./assets/js/api/categories.js"></script>
  <script src="./assets/js/api/cart.js"></script>
  <script src="./assets/js/api/orders.js"></script>
  <script src="./assets/js/api/reviews.js"></script>
  <script src="./assets/js/api/users.js"></script>

  <script src="./assets/js/components/toast.js"></script>
  <script src="./assets/js/components/loader.js"></script>
  <script src="./assets/js/components/empty-state.js"></script>
  <script src="./assets/js/components/confirmation.js"></script>
  <script src="./assets/js/components/pagination.js"></script>
  <script src="./assets/js/components/product-card.js"></script>
  <script src="./assets/js/components/drawer.js"></script>
  <script src="./assets/js/components/modal.js"></script>
  <script src="./assets/js/components/navbar.js"></script>
  <script src="./assets/js/components/footer.js"></script>

  <script src="./assets/js/store.js"></script>

  <!-- Application Bootstrap -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Store.init();
    });
  </script>
</body>
</html>
