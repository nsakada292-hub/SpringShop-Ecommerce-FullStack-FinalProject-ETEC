<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpringShop — Administrator Management Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            spring: {
              primary: '#C1E899',
              brown: '#9A6735',
              light: '#E6F0DC',
              dark: '#55883B',
              hover: '#456f30'
            }
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <link rel="stylesheet" href="./assets/css/admin.css" />
</head>
<body class="min-h-screen bg-gray-50 dark:bg-[#0f140f] text-gray-900 dark:text-gray-100 transition-colors duration-200" id="adminApp">

  <div class="flex min-h-screen">
    <!-- Sidebar Navigation -->
    <div id="adminSidebarContainer" class="hidden lg:block"></div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Topbar Header -->
      <div id="adminTopbarContainer"></div>

      <!-- Main Dashboard Tab Content with immediate fallback UI -->
      <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto" id="adminMainContent">
        <div class="min-h-[80vh] flex items-center justify-center p-4 sm:p-6">
          <div class="max-w-md w-full bg-white dark:bg-gray-900 p-6 sm:p-8 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-800 text-center">
            <div class="w-14 h-14 bg-[#E6F0DC] text-[#55883B] rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
              <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-xl font-black text-gray-900 dark:text-white">Admin Management Portal</h2>
            <p class="text-xs text-gray-500 mt-1 mb-6">Sign in with an administrator account.</p>

            <form onsubmit="AuthGuard.handleAdminLogin(event)" class="space-y-3 text-left">
              <div>
                <label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Email</label>
                <input type="email" id="adminLoginEmail" autocomplete="username" required class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-xs text-gray-900 dark:text-white" />
              </div>
              <div>
                <label class="block text-[11px] font-bold uppercase text-gray-400 mb-1">Password</label>
                <input type="password" id="adminLoginPassword" autocomplete="current-password" required class="w-full px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-xs text-gray-900 dark:text-white" />
              </div>
              <div id="adminLoginError" class="hidden text-xs text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 p-2.5 rounded-lg"></div>
              <button type="submit" id="adminSubmitBtn" class="w-full bg-[#55883B] hover:bg-[#456f30] text-white py-2.5 rounded-lg text-xs font-bold transition-colors cursor-pointer">
                <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Sign In to Dashboard
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="globalModalContainer"></div>
  <div id="confirmationModalContainer"></div>

  <!-- Scripts -->
  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/utils/storage.js"></script>
  <script src="./assets/js/utils/formatter.js"></script>
  <script src="./assets/js/utils/validator.js"></script>
  <script src="./assets/js/utils/debounce.js"></script>
  <script src="./assets/js/utils/error-handler.js"></script>
  <script src="./assets/js/utils/auth-guard.js"></script>

  <script src="./assets/js/api/client.js"></script>
  <script src="./assets/js/api/auth.js"></script>
  <script src="./assets/js/api/products.js"></script>
  <script src="./assets/js/api/categories.js"></script>
  <script src="./assets/js/api/cart.js"></script>
  <script src="./assets/js/api/orders.js"></script>
  <script src="./assets/js/api/reviews.js"></script>
  <script src="./assets/js/api/users.js"></script>

  <script src="./assets/js/components/toast.js"></script>
  <script src="./assets/js/components/loader.js"></script>
  <script src="./assets/js/components/empty-state.js"></script>
  <script src="./assets/js/components/confirmation.js"></script>
  <script src="./assets/js/components/pagination.js"></script>
  <script src="./assets/js/components/product-card.js"></script>
  <script src="./assets/js/components/drawer.js"></script>
  <script src="./assets/js/components/modal.js"></script>
  <script src="./assets/js/components/navbar.js"></script>
  <script src="./assets/js/components/footer.js"></script>

  <script src="./assets/js/store.js"></script>
  <script src="./assets/js/admin.js"></script>

  <script>
    window.addEventListener('load', () => {
      if (window.Admin) Admin.init();
    });
  </script>
</body>
</html>
